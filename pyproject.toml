[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reward-enforced-learning"
version = "0.1.0"
description = "A reinforcement learning workbench that runs in a terminal and imports nothing."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Stiven Gjekaj" }]
requires-python = ">=3.11"

# This list is empty on purpose, and a test holds it empty. The whole project
# runs on the standard library. See docs/architecture.md for what that buys and
# what it costs.
dependencies = []

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/Stiven-Gjekaj/RewardEnforcedLearning"
Issues = "https://github.com/Stiven-Gjekaj/RewardEnforcedLearning/issues"
Changelog = "https://github.com/Stiven-Gjekaj/RewardEnforcedLearning/blob/main/CHANGELOG.md"

[project.scripts]
rel = "rel.cli:main"

[tool.setuptools.packages.find]
include = ["rel*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",    # pycodestyle
  "F",    # pyflakes
  "I",    # import order
  "N",    # naming
  "UP",   # rewrite for the target version
  "B",    # likely bugs
  "SIM",  # simplify
  "RUF",  # ruff's own rules
]
ignore = [
  # A single letter name is the name that the literature uses for these
  # quantities. Renaming `q` to `action_values` in an update rule makes the
  # rule harder to check against the book it comes from, not easier.
  "E741",
]

[tool.ruff.lint.per-file-ignores]
# A test states the numbers it needs. Some of those numbers are long.
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["rel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

# Run the suite against the checkout, with no install step. The package has no
# compiled part and no entry point that the tests need, so an install would add
# a way for the tests and the source to disagree and would buy nothing.
pythonpath = ["."]
markers = [
  "slow: a test that trains for long enough to be worth skipping during a quick loop",
]
